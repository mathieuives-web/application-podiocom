services:
  app:
    build: .
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL}
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"

  # Reverse proxy avec HTTPS automatique (Let's Encrypt).
  # Remplacez "votre-domaine.com" dans le Caddyfile par votre nom de domaine réel.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
